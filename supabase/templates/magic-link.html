<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f6f6f4;font-family:Arial,sans-serif;color:#171714">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #ecebe7;border-radius:22px;padding:32px">
          <tr><td>
            <div style="font-size:20px;font-weight:800;letter-spacing:2px;color:#f36b21">FITORA</div>
            <h1 style="margin:28px 0 10px;font-size:28px;line-height:1.2">Your Fitora login code</h1>
            <p style="margin:0 0 20px;color:#6f6f69;font-size:15px;line-height:1.6">Enter this one-time code in the Fitora app to securely log in. No password is required.</p>
            <div style="display:inline-block;background:#fff3eb;border:1px solid #ffd8bf;color:#f36b21;font-size:32px;font-weight:800;letter-spacing:8px;padding:16px 20px;border-radius:14px">{{ .Token }}</div>
            <p style="margin:18px 0 0;color:#6f6f69;font-size:13px;line-height:1.6">Do not share this code with anyone.</p>
            <p style="margin:26px 0 0;color:#96968f;font-size:12px;line-height:1.6">If you did not request this code, you can safely ignore this email.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
